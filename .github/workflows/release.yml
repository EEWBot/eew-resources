name: release

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1

      - name: build
        run: |
          . ./prepare-resvg.sh
          ./build.sh

      - name: pre-release
        uses: softprops/action-gh-release@v3.0.2
        if: "! startsWith(github.ref, 'refs/tags/')"
        with:
          tag_name: "latest"
          prerelease: true
          name: "Development Build"
          files: |
            target/*
            resources.tar

      - name: tagged-release
        uses: softprops/action-gh-release@v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: false
          files: |
            target/*
            resources.tar

