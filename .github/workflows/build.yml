name: build

on:
  pull_request:
    paths:
      - 'build.sh'
      - 'prepare-resvg.sh'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: build
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7.0.1

      - name: build
        run: |
          . ./prepare-resvg.sh
          ./build.sh
